services:
  fe:
    build:
      context: ./FE
    container_name: compassed-fe
    restart: unless-stopped
    environment:
      FE_HOST: 0.0.0.0
      FE_PORT: 3000
      API_BASE: ${FE_API_BASE:https://compassed.io.vn}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:}
    ports:
      - "3000:3000"

  be:
    build:
      context: ./BE/compassed-api
    container_name: compassed-be
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:}
      OPENAI_API_KEY: ${OPENAI_API_KEY:}
      OPENAI_MODEL: ${OPENAI_MODEL:gpt-5}
      MAIL_HOST: ${MAIL_HOST:smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:587}
      MAIL_USERNAME: ${MAIL_USERNAME:}
      MAIL_PASSWORD: ${MAIL_PASSWORD:}
      MAIL_FROM: ${MAIL_FROM:}
      MYSQL_URL: ${MYSQL_URL:jdbc:mysql://mysql:3306/compassed?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
      MYSQL_USER: ${MYSQL_USER:root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:1234}
      JWT_SECRET: ${JWT_SECRET:change-me-compassed-jwt-secret-32chars-min}
      SERVER_PORT: ${SERVER_PORT:8080}
      CHECKOUT_QR_IMAGE_URL: ${CHECKOUT_QR_IMAGE_URL:https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=CompassED_Payment_Placeholder}
      CHECKOUT_QR_ACCOUNT_NAME: ${CHECKOUT_QR_ACCOUNT_NAME:COMPASSED}
      CHECKOUT_QR_ACCOUNT_NO: ${CHECKOUT_QR_ACCOUNT_NO:0000000000}
      CHECKOUT_QR_BANK: ${CHECKOUT_QR_BANK:VietQR}
      CHECKOUT_QR_BANK_BIN: ${CHECKOUT_QR_BANK_BIN:970422}
      PAYOS_ENABLED: ${PAYOS_ENABLED:true}
      PAYOS_CLIENT_ID: ${PAYOS_CLIENT_ID:}
      PAYOS_API_KEY: ${PAYOS_API_KEY:}
      PAYOS_CHECKSUM_KEY: ${PAYOS_CHECKSUM_KEY:}
      PAYOS_BASE_URL: ${PAYOS_BASE_URL:https://api-merchant.payos.vn}
      PAYOS_RETURN_URL: ${PAYOS_RETURN_URL:https://compassed.io.vn/checkout}
      PAYOS_CANCEL_URL: ${PAYOS_CANCEL_URL:https://compassed.io.vn/checkout}
      PAYOS_CHECK_COOLDOWN_SECONDS: ${PAYOS_CHECK_COOLDOWN_SECONDS:15}
    ports:
      - "8080:8080"

  mysql:
    image: mysql:8.0
    container_name: compassed-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: compassed
    ports:
      - "3307:3306"
    volumes:
      - compassed_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "mysql", "-uroot", "-p1234"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  compassed_mysql_data:
