services:
  fe:
    build:
      context: ./FE
    container_name: compassed-fe
    restart: unless-stopped
    environment:
      FE_HOST: 0.0.0.0
      FE_PORT: 3000
      API_BASE: https://compassed.io.vn
      GOOGLE_CLIENT_ID: 418581116582-qet8ant9k0t319hkd3640dtsa54eg07v.apps.googleusercontent.com
    ports:
      - "3000:3000"

  be:
    build:
      context: ./BE/compassed-api
    container_name: compassed-be
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      GOOGLE_CLIENT_ID: 418581116582-qet8ant9k0t319hkd3640dtsa54eg07v.apps.googleusercontent.com
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      MAIL_HOST: smtp.gmail.com
      MAIL_PORT: 587
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MYSQL_URL: jdbc:mysql://mysql:3306/compassed?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      SERVER_PORT: 8080
      CHECKOUT_QR_IMAGE_URL: https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=CompassED_Payment_Placeholder
      CHECKOUT_QR_ACCOUNT_NAME: COMPASSED
      CHECKOUT_QR_ACCOUNT_NO: 8990186866886
      CHECKOUT_QR_BANK: VietQR
      CHECKOUT_QR_BANK_BIN: 970422
      PAYOS_ENABLED: ${PAYOS_ENABLED:-false}
      PAYOS_CLIENT_ID: ${PAYOS_CLIENT_ID:-}
      PAYOS_API_KEY: ${PAYOS_API_KEY:-}
      PAYOS_CHECKSUM_KEY: ${PAYOS_CHECKSUM_KEY:-}
      PAYOS_BASE_URL: https://api-merchant.payos.vn
      PAYOS_RETURN_URL: https://compassed.io.vn/checkout
      PAYOS_CANCEL_URL: https://compassed.io.vn/checkout
      PAYOS_CHECK_COOLDOWN_SECONDS: 15
    ports:
      - "8080:8080"

  mysql:
    image: mysql:8.0
    container_name: compassed-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: compassed
    ports:
      - "3307:3306"
    volumes:
      - compassed_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "mysql", "-uroot", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  compassed_mysql_data:
