<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CompassED - Gia sư lộ trình</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            primary: "#0d7ff2",
            "background-light": "#f5f7f8",
            "background-dark": "#101922",
          },
          fontFamily: {
            display: ["Inter", "sans-serif"],
          },
          borderRadius: {
            DEFAULT: "0.25rem",
            lg: "0.5rem",
            xl: "0.75rem",
            full: "9999px",
          },
        },
      },
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
    rel="stylesheet" />
  <style>
    body { font-family: Inter, sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900">
  <header
    class="fixed inset-x-0 top-0 z-50 flex w-full items-center justify-between border-b border-slate-200 bg-white px-6 py-4 lg:px-20">
    <a class="flex items-center gap-4" href="/landing" style="text-decoration:none;color:inherit;">
      <div class="flex h-10 w-10 items-center justify-center rounded-lg bg-primary/10 text-primary">
        <span class="material-symbols-outlined text-3xl">explore</span>
      </div>
      <h2 class="text-xl font-bold tracking-tight text-slate-900">CompassED</h2>
    </a>
    <nav class="hidden items-center gap-8 md:flex">
      <a class="text-sm font-medium text-slate-600 hover:text-primary transition-colors" href="/landing">Home</a>
      <div id="rt-learning-dropdown" class="relative">
        <button id="rt-nav-learning" class="inline-flex items-center gap-1 text-sm font-medium text-slate-600 hover:text-primary transition-colors" type="button">
          Learning
          <span class="material-symbols-outlined" style="font-size:18px;">expand_more</span>
        </button>
        <div id="rt-nav-learning-menu" class="hidden absolute left-0 top-[calc(100%+8px)] min-w-[220px] rounded-xl border border-slate-200 bg-white p-2 shadow-xl">
          <button id="rt-nav-learning-practice" class="w-full rounded-lg px-3 py-2 text-left text-sm font-medium text-slate-700 hover:bg-slate-100" type="button">Làm đề</button>
          <button id="rt-nav-learning-roadmap" class="w-full rounded-lg px-3 py-2 text-left text-sm font-medium text-slate-700 hover:bg-slate-100" type="button">Roadmap Tutor</button>
          <button id="rt-nav-learning-ai" class="w-full rounded-lg px-3 py-2 text-left text-sm font-medium text-slate-700 hover:bg-slate-100" type="button">Học cùng AI</button>
        </div>
      </div>
      <a class="text-sm font-medium text-slate-600 hover:text-primary transition-colors" href="#">How It
        Works</a>
      <a class="text-sm font-medium text-slate-600 hover:text-primary transition-colors" href="/checkout">Pricing</a>
    </nav>
    <div class="flex items-center gap-4">
      <a id="landing-login-link" class="hidden text-sm font-medium text-slate-600 hover:text-primary md:block"
        href="/auth">Login</a>
      <a id="landing-get-started-top" href="/landing"
        class="flex h-10 cursor-pointer items-center justify-center rounded-lg bg-primary px-5 text-sm font-bold text-white transition-colors hover:bg-blue-600">
        Get Started
      </a>
    </div>
  </header>

  <main id="rt-app" class="hidden mx-auto w-full max-w-7xl px-4 py-6 pt-[96px] md:px-6">
    <header class="mb-5">
      <h1 id="rt-title" class="text-2xl font-extrabold">Gia sư lộ trình</h1>
      <p id="rt-subtitle" class="mt-1 text-sm text-slate-600">Trao đổi với AI dựa trên roadmap và tiến độ học tập hiện tại của bạn.</p>
    </header>

    <section class="grid grid-cols-1 gap-4 lg:grid-cols-[360px,1fr]">
      <aside class="space-y-4">
        <div class="rounded-xl border border-slate-200 bg-white p-4">
          <label for="rt-subject-select" class="mb-2 block text-sm font-semibold text-slate-700">Môn học</label>
          <select id="rt-subject-select" class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm"></select>
          <p id="rt-subject-label" class="mt-2 text-xs text-slate-500"></p>
        </div>

        <div class="rounded-xl border border-slate-200 bg-white p-4">
          <h2 class="mb-3 text-sm font-extrabold uppercase tracking-wide text-slate-700">Thông tin roadmap</h2>
          <dl class="grid grid-cols-2 gap-x-3 gap-y-2 text-sm">
            <dt class="text-slate-500">Cấp độ</dt>
            <dd id="rt-level" class="font-semibold text-slate-900">-</dd>
            <dt class="text-slate-500">Giai đoạn</dt>
            <dd id="rt-phase" class="font-semibold text-slate-900">-</dd>
            <dt class="text-slate-500">Tiến độ</dt>
            <dd id="rt-progress" class="font-semibold text-slate-900">0%</dd>
            <dt class="text-slate-500">Placement</dt>
            <dd id="rt-placement" class="font-semibold text-slate-900">-</dd>
            <dt class="text-slate-500">Bước tiếp theo</dt>
            <dd id="rt-next-step" class="font-semibold text-slate-900">-</dd>
          </dl>
          <div class="mt-3 h-2 overflow-hidden rounded-full bg-slate-100">
            <div id="rt-progress-bar" class="h-full w-0 bg-blue-600"></div>
          </div>
        </div>

        <div class="rounded-xl border border-slate-200 bg-white p-4">
          <h2 class="mb-2 text-sm font-extrabold uppercase tracking-wide text-slate-700">Tiến độ học</h2>
          <p id="rt-lesson-summary" class="text-sm text-slate-700">Bài học: -</p>
          <p id="rt-mini-summary" class="text-sm text-slate-700">Mini test: -</p>
          <button id="rt-go-placement" class="mt-3 hidden rounded-lg border border-amber-300 bg-amber-50 px-3 py-2 text-sm font-semibold text-amber-700">Đi làm placement test</button>
        </div>

        <div class="rounded-xl border border-slate-200 bg-white p-4">
          <h2 class="mb-2 text-sm font-extrabold uppercase tracking-wide text-slate-700">Gợi ý nhanh</h2>
          <div class="flex flex-wrap gap-2">
            <button data-prompt="tóm tắt roadmap môn này" class="rt-prompt rounded-full bg-slate-100 px-3 py-1.5 text-xs font-semibold text-slate-700">Tóm tắt roadmap</button>
            <button data-prompt="điểm yếu hiện tại của tôi là gì" class="rt-prompt rounded-full bg-slate-100 px-3 py-1.5 text-xs font-semibold text-slate-700">Điểm yếu</button>
            <button data-prompt="tôi nên học gì tiếp theo" class="rt-prompt rounded-full bg-slate-100 px-3 py-1.5 text-xs font-semibold text-slate-700">Học tiếp theo</button>
            <button data-prompt="chiến lược mini test và final test" class="rt-prompt rounded-full bg-slate-100 px-3 py-1.5 text-xs font-semibold text-slate-700">Mini/Final test</button>
          </div>
        </div>
      </aside>

      <section class="rounded-xl border border-slate-200 bg-white p-4">
        <div id="rt-chat-list" class="mb-4 h-[560px] space-y-3 overflow-y-auto rounded-lg border border-slate-100 bg-slate-50 p-3"></div>
        <form id="rt-chat-form" class="flex gap-2">
          <input id="rt-chat-input" type="text" placeholder="Đặt câu hỏi về roadmap của bạn..." class="flex-1 rounded-lg border border-slate-300 px-3 py-2 text-sm" />
          <button type="submit" class="rounded-lg bg-blue-600 px-4 py-2 text-sm font-bold text-white">Gửi</button>
        </form>
      </section>
    </section>
  </main>
  <script src="../config.js"></script>
  <script type="module" src="../js/main.js"></script>
</body>
</html>
